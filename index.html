<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insulin Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/latest/umd/lucide.min.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div id="app"></div>

    <script>
        class InsulinCalculator {
            constructor() {
                this.formulas = {};
                this.selectedPerson = null;
                this.bloodSugar = '';
                this.carbs = '';
                this.result = null;
                this.history = {};
                this.expandedPerson = null;
                this.showAddPerson = false;
                this.newPersonName = '';
                this.newPersonFormula = {
                    target: '',
                    correctionFactor: '',
                    carbRatio: ''
                };
                this.loading = true;

                this.loadData();
            }

            async loadData() {
                try {
                    // Try to load from localStorage
                    const formulasStored = localStorage.getItem('insulin-calculator-formulas');
                    const historyStored = localStorage.getItem('insulin-calculator-history');

                    if (formulasStored) {
                        this.formulas = JSON.parse(formulasStored);
                        const firstPerson = Object.keys(this.formulas)[0];
                        this.selectedPerson = firstPerson || null;
                    }

                    if (historyStored) {
                        this.history = JSON.parse(historyStored);
                    }
                } catch (err) {
                    console.log('Data not found, starting fresh');
                }
                this.loading = false;
                this.render();
            }

            saveFormulas() {
                if (Object.keys(this.formulas).length > 0) {
                    localStorage.setItem('insulin-calculator-formulas', JSON.stringify(this.formulas));
                }
            }

            saveHistory() {
                if (Object.keys(this.history).length > 0) {
                    localStorage.setItem('insulin-calculator-history', JSON.stringify(this.history));
                }
            }

            addPerson() {
                if (!this.newPersonName.trim()) {
                    alert('Please enter a name');
                    return;
                }

                if (this.formulas[this.newPersonName]) {
                    alert('This person already exists');
                    return;
                }

                if (!this.newPersonFormula.target || !this.newPersonFormula.correctionFactor || !this.newPersonFormula.carbRatio) {
                    alert('Please fill in all formula fields');
                    return;
                }

                this.formulas[this.newPersonName] = {
                    target: parseFloat(this.newPersonFormula.target),
                    correctionFactor: parseFloat(this.newPersonFormula.correctionFactor),
                    carbRatio: parseFloat(this.newPersonFormula.carbRatio)
                };

                this.history[this.newPersonName] = [];
                this.selectedPerson = this.newPersonName;
                this.newPersonName = '';
                this.newPersonFormula = { target: '', correctionFactor: '', carbRatio: '' };
                this.showAddPerson = false;
                this.saveFormulas();
                this.saveHistory();
                this.render();
            }

            deletePerson(person) {
                if (confirm(`Are you sure you want to delete ${person} and all their history?`)) {
                    delete this.formulas[person];
                    delete this.history[person];

                    const remaining = Object.keys(this.formulas)[0];
                    this.selectedPerson = remaining || null;
                    this.saveFormulas();
                    this.saveHistory();
                    this.render();
                }
            }

            ceilToWholeUnit(num) {
                return Math.ceil(num);
            }

            calculateInsulin() {
                if (!this.selectedPerson) {
                    alert('Please add a person first');
                    return;
                }

                if (!this.bloodSugar || isNaN(this.bloodSugar)) {
                    alert('Please enter a valid blood sugar reading');
                    return;
                }

                const formula = this.formulas[this.selectedPerson];
                const bs = parseFloat(this.bloodSugar);
                const carbAmount = this.carbs ? parseFloat(this.carbs) : 0;

                const correction = (bs - formula.target) / formula.correctionFactor;
                const carbCoverage = carbAmount > 0 ? carbAmount / formula.carbRatio : 0;
                const totalInsulin = correction + carbCoverage;
                const roundedInsulin = this.ceilToWholeUnit(totalInsulin);

                this.result = {
                    id: Date.now(),
                    date: new Date().toLocaleString(),
                    bloodSugar: bs,
                    carbs: carbAmount,
                    correction: parseFloat(correction.toFixed(2)),
                    carbCoverage: parseFloat(carbCoverage.toFixed(2)),
                    total: parseFloat(totalInsulin.toFixed(2)),
                    rounded: roundedInsulin
                };

                if (!this.history[this.selectedPerson]) {
                    this.history[this.selectedPerson] = [];
                }
                this.history[this.selectedPerson].unshift(this.result);

                this.bloodSugar = '';
                this.carbs = '';
                this.saveHistory();
                this.render();
            }

            deleteHistoryEntry(person, id) {
                this.history[person] = this.history[person].filter(entry => entry.id !== id);
                this.saveHistory();
                this.render();
            }

            clearAllHistory(person) {
                if (confirm(`Are you sure you want to clear all history for ${person}?`)) {
                    this.history[person] = [];
                    this.saveHistory();
                    this.render();
                }
            }

            render() {
                const app = document.getElementById('app');
                const people = Object.keys(this.formulas);

                if (this.loading) {
                    app.innerHTML = `
                        <div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-slate-900 to-slate-800">
                            <div class="text-white text-lg">Loading...</div>
                        </div>
                    `;
                    return;
                }

                let html = `
                    <div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-6">
                        <div class="max-w-2xl mx-auto">
                            <!-- Header -->
                            <div class="mb-8">
                                <h1 class="text-4xl font-bold text-white mb-2">Insulin Calculator</h1>
                                <p class="text-slate-400">Personalized dosing calculations with history</p>
                            </div>

                            <!-- People Management -->
                            <div class="bg-slate-800 rounded-lg p-6 mb-6 border border-slate-700">
                                <div class="flex items-center justify-between mb-4">
                                    <label class="block text-sm font-semibold text-slate-300">Select Person</label>
                                    <button onclick="calculator.showAddPerson = true; calculator.render()" class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg text-sm font-semibold transition-all">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                        Add Person
                                    </button>
                                </div>

                                ${people.length === 0 ? `
                                    <div class="text-center py-8 text-slate-400">
                                        <p>No people added yet. Click "Add Person" to get started!</p>
                                    </div>
                                ` : `
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        ${people.map(person => `
                                            <div class="relative">
                                                <button onclick="calculator.selectedPerson = '${person}'; calculator.render()" class="w-full py-3 px-4 rounded-lg font-semibold transition-all text-left ${
                                                    this.selectedPerson === person
                                                        ? 'bg-blue-600 text-white shadow-lg'
                                                        : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                                }">
                                                    ${person}
                                                </button>
                                                <button onclick="calculator.deletePerson('${person}')" class="absolute right-2 top-1/2 transform -translate-y-1/2 p-1 hover:bg-red-600 hover:bg-opacity-50 rounded transition-colors text-red-400">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                                </button>
                                            </div>
                                        `).join('')}
                                    </div>
                                `}
                            </div>

                            <!-- Add Person Modal -->
                            ${this.showAddPerson ? `
                                <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                                    <div class="bg-slate-800 rounded-lg p-6 border border-slate-700 max-w-md w-full">
                                        <div class="flex items-center justify-between mb-6">
                                            <h2 class="text-2xl font-bold text-white">Add New Person</h2>
                                            <button onclick="calculator.showAddPerson = false; calculator.render()" class="p-1 hover:bg-slate-700 rounded transition-colors">
                                                <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                            </button>
                                        </div>

                                        <div class="space-y-4">
                                            <div>
                                                <label class="block text-sm font-semibold text-slate-300 mb-2">Name</label>
                                                <input type="text" id="newPersonName" value="${this.newPersonName}" onchange="calculator.newPersonName = this.value" placeholder="e.g., John, Mom, etc." class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50" />
                                            </div>

                                            <div>
                                                <label class="block text-sm font-semibold text-slate-300 mb-2">Target Blood Sugar</label>
                                                <input type="number" id="newPersonTarget" value="${this.newPersonFormula.target}" onchange="calculator.newPersonFormula.target = this.value" placeholder="e.g., 120" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50" />
                                            </div>

                                            <div>
                                                <label class="block text-sm font-semibold text-slate-300 mb-2">Correction Factor</label>
                                                <input type="number" id="newPersonCorrectionFactor" value="${this.newPersonFormula.correctionFactor}" onchange="calculator.newPersonFormula.correctionFactor = this.value" placeholder="e.g., 35" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50" />
                                                <p class="text-xs text-slate-400 mt-1">Formula: (Blood Sugar - Target) ÷ Correction Factor</p>
                                            </div>

                                            <div>
                                                <label class="block text-sm font-semibold text-slate-300 mb-2">Carb Ratio</label>
                                                <input type="number" id="newPersonCarbRatio" value="${this.newPersonFormula.carbRatio}" onchange="calculator.newPersonFormula.carbRatio = this.value" placeholder="e.g., 10" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50" />
                                                <p class="text-xs text-slate-400 mt-1">Formula: Carbs ÷ Carb Ratio</p>
                                            </div>

                                            <div class="flex gap-3 pt-4">
                                                <button onclick="calculator.addPerson()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-all">Add Person</button>
                                                <button onclick="calculator.showAddPerson = false; calculator.render()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-lg transition-all">Cancel</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ` : ''}

                            <!-- Calculator -->
                            ${this.selectedPerson ? `
                                <div class="bg-slate-800 rounded-lg p-6 mb-6 border border-slate-700">
                                    <h2 class="text-xl font-bold text-white mb-6">${this.selectedPerson}'s Calculator</h2>

                                    <div class="space-y-4 mb-6">
                                        <div>
                                            <label class="block text-sm font-semibold text-slate-300 mb-2">Blood Sugar (mg/dL)</label>
                                            <input type="number" id="bloodSugar" value="${this.bloodSugar}" onchange="calculator.bloodSugar = this.value" onkeypress="if(event.key==='Enter') calculator.calculateInsulin()" placeholder="e.g., 180" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50" />
                                        </div>

                                        <div>
                                            <label class="block text-sm font-semibold text-slate-300 mb-2">Carbohydrates (g) - Optional</label>
                                            <input type="number" id="carbs" value="${this.carbs}" onchange="calculator.carbs = this.value" onkeypress="if(event.key==='Enter') calculator.calculateInsulin()" placeholder="e.g., 45" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50" />
                                        </div>
                                    </div>

                                    <button onclick="calculator.calculateInsulin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-all shadow-lg hover:shadow-xl">Calculate Insulin Dose</button>
                                </div>

                                <!-- Result -->
                                ${this.result ? `
                                    <div class="bg-green-900 bg-opacity-30 border border-green-600 rounded-lg p-6 mb-6">
                                        <div class="mb-4">
                                            <p class="text-slate-300 text-sm mb-2">Calculated Dose</p>
                                            <div class="text-5xl font-bold text-green-400">${this.result.rounded}</div>
                                            <p class="text-slate-400 text-sm mt-1">units (rounded up)</p>
                                        </div>

                                        <div class="grid grid-cols-2 gap-4 text-sm">
                                            <div class="bg-slate-700 bg-opacity-50 rounded p-3">
                                                <p class="text-slate-400">Correction</p>
                                                <p class="text-white font-semibold">${this.result.correction} units</p>
                                            </div>
                                            <div class="bg-slate-700 bg-opacity-50 rounded p-3">
                                                <p class="text-slate-400">Carb Coverage</p>
                                                <p class="text-white font-semibold">${this.result.carbCoverage} units</p>
                                            </div>
                                            <div class="bg-slate-700 bg-opacity-50 rounded p-3">
                                                <p class="text-slate-400">Blood Sugar</p>
                                                <p class="text-white font-semibold">${this.result.bloodSugar} mg/dL</p>
                                            </div>
                                            <div class="bg-slate-700 bg-opacity-50 rounded p-3">
                                                <p class="text-slate-400">Carbs</p>
                                                <p class="text-white font-semibold">${this.result.carbs} g</p>
                                            </div>
                                        </div>

                                        <p class="text-slate-400 text-xs mt-4">${this.result.date}</p>
                                    </div>
                                ` : ''}

                                <!-- History -->
                                <div class="bg-slate-800 rounded-lg border border-slate-700 overflow-hidden">
                                    <button onclick="calculator.expandedPerson = calculator.expandedPerson === '${this.selectedPerson}' ? null : '${this.selectedPerson}'; calculator.render()" class="w-full px-6 py-4 flex items-center justify-between hover:bg-slate-700 transition-colors">
                                        <div class="flex items-center gap-3">
                                            <h2 class="text-lg font-bold text-white">${this.selectedPerson}'s History</h2>
                                            <span class="bg-blue-600 text-white text-sm font-semibold px-3 py-1 rounded-full">${(this.history[this.selectedPerson] || []).length}</span>
                                        </div>
                                        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            ${this.expandedPerson === this.selectedPerson ? 
                                                '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>' :
                                                '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>'
                                            }
                                        </svg>
                                    </button>

                                    ${this.expandedPerson === this.selectedPerson ? `
                                        <div class="border-t border-slate-700">
                                            ${(this.history[this.selectedPerson] || []).length === 0 ? `
                                                <div class="px-6 py-8 text-center text-slate-400">
                                                    No history yet. Make your first calculation above!
                                                </div>
                                            ` : `
                                                <div class="divide-y divide-slate-700 max-h-96 overflow-y-auto">
                                                    ${(this.history[this.selectedPerson] || []).map(entry => `
                                                        <div class="px-6 py-4 hover:bg-slate-700 transition-colors">
                                                            <div class="flex items-start justify-between mb-2">
                                                                <div>
                                                                    <p class="text-sm text-slate-400 mb-1">${entry.date}</p>
                                                                    <div class="flex items-baseline gap-2">
                                                                        <span class="text-3xl font-bold text-green-400">${entry.rounded}</span>
                                                                        <span class="text-slate-400 text-sm">units</span>
                                                                    </div>
                                                                </div>
                                                                <button onclick="calculator.deleteHistoryEntry('${this.selectedPerson}', ${entry.id})" class="p-2 hover:bg-red-600 hover:bg-opacity-30 rounded transition-colors text-red-400">
                                                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                                </button>
                                                            </div>
                                                            <div class="grid grid-cols-2 gap-2 text-xs">
                                                                <span class="text-slate-400">BS: <span class="text-white">${entry.bloodSugar}</span> mg/dL</span>
                                                                <span class="text-slate-400">Carbs: <span class="text-white">${entry.carbs}</span>g</span>
                                                                <span class="text-slate-400">Correction: <span class="text-white">${entry.correction}</span></span>
                                                                <span class="text-slate-400">Coverage: <span class="text-white">${entry.carbCoverage}</span></span>
                                                            </div>
                                                        </div>
                                                    `).join('')}
                                                </div>

                                                <button onclick="calculator.clearAllHistory('${this.selectedPerson}')" class="w-full px-6 py-3 text-red-400 hover:bg-red-600 hover:bg-opacity-20 transition-colors text-sm font-semibold border-t border-slate-700">
                                                    Clear All History
                                                </button>
                                            `}
                                        </div>
                                    ` : ''}
                                </div>

                                <!-- Formula Reference -->
                                <div class="mt-6 bg-slate-800 bg-opacity-50 rounded-lg p-4 border border-slate-700">
                                    <p class="text-xs text-slate-400">
                                        <span class="font-semibold text-slate-300">Formula for ${this.selectedPerson}:</span>
                                        <br />
                                        Correction: (BS - ${this.formulas[this.selectedPerson].target}) ÷ ${this.formulas[this.selectedPerson].correctionFactor}
                                        <br />
                                        Carbs: ÷ ${this.formulas[this.selectedPerson].carbRatio}
                                    </p>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;

                app.innerHTML = html;
            }
        }

        const calculator = new InsulinCalculator();
    </script>
</body>
</html>
